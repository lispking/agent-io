[package]
name = "agent-io-macros"
version = "0.3.1"
edition = "2024"
description = "Procedural macros for the agent-io SDK"
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing", "printing"] }
quote = "1"
proc-macro2 = "1"
serde_json = "1"
